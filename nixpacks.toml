[phases.setup]
aptPkgs = ["xvfb", "fonts-liberation", "libnss3", "libatk-bridge2.0-0", "libdrm2", "libxkbcommon0", "libgbm1", "libasound2t64", "libxshmfence1", "libglu1-mesa"]

[phases.install]
cmds = ["npm install", "npm install --prefix web", "npx playwright install --with-deps chromium"]

[phases.build]
cmds = ["npm run build --prefix web"]

[start]
cmd = "xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' node src/server.js"
